# prefect.yaml
name: mon-projet-prefect
prefect-version: 3.0.0

build: null
push: null

pull:
  - prefect.deployments.steps.git_clone:
      repository: https://github.com/edadou-byte/data-architect-roadmap.git
      branch: master

deployments:
  - name: main-deployment
    description: "Traite les IDs clients"
    entrypoint: Orchestration/Prefect/flows/customer_flow.py:main
    work_pool:
      name: mon-work-pool
      work_queue_name: default
    schedule:
      cron: "*/5 * * * *"    # tous les jours à 6h
      timezone: "Europe/Paris"