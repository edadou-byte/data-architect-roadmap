# prefect.yaml
name: mon-projet-prefect
prefect-version: 3.0.0

build: null
push: null

pull:
  - prefect.deployments.steps.set_working_directory:
      directory: /chemin/vers/mon_projet_prefect

deployments:
  - name: main-deployment
    version: 1.0
    tags: ["clients"]
    description: "Traite les IDs clients"
    entrypoint: flows/customer_flow.py:main
    work_pool:
      name: mon-work-pool
      work_queue_name: default
    schedule:
      cron: "0 6 * * *"    # tous les jours à 6h
      timezone: "Europe/Paris"
    parameters: {}